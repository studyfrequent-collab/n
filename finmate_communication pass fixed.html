<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FinMate Pro • Smart Finance</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Inter', sans-serif; }
    body { background: radial-gradient(circle at 10% 30%, #eef2ff, #e0e7ff); overflow-x: hidden; min-height: 100vh; }
    
    /* App Bar - Center Aligned */
    .app-bar { 
      position: fixed; top:0; left:0; right:0; 
      background: rgba(15,23,42,0.95); 
      backdrop-filter: blur(16px); 
      color: white; 
      padding: 14px 24px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      gap: 20px; 
      z-index: 1100; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
      border-bottom: 1px solid rgba(255,255,255,0.2); 
    }
    .menu-icon { 
      position: absolute;
      left: 20px;
      font-size: 26px; 
      background: rgba(255,255,255,0.15); 
      border: none; 
      color: white; 
      cursor: pointer; 
      border-radius: 60px; 
      width: 44px; 
      height: 44px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      transition: 0.2s; 
    }
    .menu-icon:hover { background: rgba(255,255,255,0.3); transform: scale(0.96); }
    .app-title { 
      font-size: 1.6rem; 
      font-weight: 800; 
      background: linear-gradient(125deg, #FFFFFF, #a5f3fc, #c4b5fd); 
      -webkit-background-clip: text; 
      background-clip: text; 
      color: transparent; 
      text-align: center;
    }
    
    /* Drawer - Left Align Items */
    .drawer { 
      position: fixed; top:0; left:-300px; width:300px; height:100%; 
      background: rgba(255,255,255,0.98); 
      backdrop-filter: blur(18px); 
      z-index:1200; 
      transition: left 0.3s cubic-bezier(0.2,0.9,0.4,1.1); 
      box-shadow: 12px 0 35px rgba(0,0,0,0.2); 
      border-right: 1px solid rgba(255,255,255,0.6); 
      display: flex; 
      flex-direction: column; 
    }
    .drawer.open { left: 0; }
    .drawer-header { 
      padding: 32px 24px 20px; 
      border-bottom: 1px solid #eef2ff; 
      background: linear-gradient(135deg, #f8fafc, #ffffff); 
      text-align: left;
    }
    .drawer-header h3 { 
      font-size: 1.8rem; 
      background: linear-gradient(135deg, #2563eb, #9333ea); 
      -webkit-background-clip: text; 
      background-clip: text; 
      color: transparent; 
      font-weight: 800; 
      text-align: left;
    }
    .drawer-nav { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      padding: 20px 16px; 
      flex:1; 
      overflow-y: auto; 
    }
    .drawer-nav button { 
      background: rgba(255,255,255,0.7); 
      border: none; 
      text-align: left; 
      padding: 12px 20px; 
      font-size: 1rem; 
      font-weight: 600; 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      cursor: pointer; 
      transition: all 0.2s; 
      color: #1e293b; 
      width: 100%; 
    }
    .drawer-nav button:hover { 
      background: linear-gradient(105deg, #ffffff, #eef2ff); 
      transform: translateX(5px); 
      box-shadow: 0 8px 16px -8px rgba(0,0,0,0.15); 
      color: #2563eb; 
    }
    .overlay { 
      position: fixed; top:0; left:0; width:100%; height:100%; 
      background: rgba(0,0,0,0.4); 
      backdrop-filter: blur(5px); 
      z-index:1150; 
      visibility: hidden; 
      opacity:0; 
      transition: 0.2s; 
    }
    .overlay.active { visibility: visible; opacity:1; }
    
    /* Main Content - Center Aligned */
    .main-content { 
      margin-top: 80px; 
      padding: 24px 20px 40px; 
      max-width: 1400px; 
      margin-left: auto; 
      margin-right: auto; 
      text-align: center;
    }
    .page { display: none; animation: fadeUp 0.25s ease; }
    .active-page { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    
    /* Cards - Center Aligned */
    .card { 
      background: rgba(255,255,255,0.85); 
      backdrop-filter: blur(12px); 
      border-radius: 48px; 
      padding: 28px; 
      margin-bottom: 32px; 
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2); 
      border: 1px solid rgba(255,255,255,0.6); 
      text-align: center;
    }
    .card h2 { 
      font-size: 1.7rem; 
      margin-bottom: 24px; 
      border-left: 8px solid #3b82f6; 
      padding-left: 22px; 
      background: linear-gradient(120deg, #1e293b, #334155); 
      -webkit-background-clip: text; 
      background-clip: text; 
      color: transparent; 
      font-weight: 700; 
      text-align: left;
      display: inline-block;
    }
    
    /* Form Elements - Center Aligned */
    .form-group { margin-bottom: 20px; text-align: center; }
    label { 
      display: block; 
      font-weight: 700; 
      margin-bottom: 6px; 
      font-size: 0.8rem; 
      color: #1e293b; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      text-align: center; 
    }
    input, select, textarea { 
      width: 100%; 
      max-width: 500px; 
      margin: 0 auto; 
      padding: 12px 18px; 
      border: 1px solid #cbd5e1; 
      border-radius: 48px; 
      font-size: 0.95rem; 
      background: white; 
      outline: none; 
      text-align: center; 
      display: block; 
      transition: 0.2s; 
    }
    input:focus, select:focus, textarea:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.2); }
    
    /* Grids - Center Aligned */
    .row-2cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .row-5cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; max-width: 1200px; margin: 0 auto; }
    
    /* Buttons */
    .btn, button:not(.menu-icon) { 
      border: none; padding: 10px 20px; border-radius: 60px; font-weight: 700; cursor: pointer; 
      transition: 0.2s; font-size: 0.85rem; margin: 4px; display: inline-flex; align-items: center; 
      gap: 8px; justify-content: center; min-width: 100px; 
    }
    .btn-primary { background: linear-gradient(105deg, #3b82f6, #7c3aed); color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -6px #3b82f6; }
    .btn-success { background: linear-gradient(105deg, #10b981, #047857); color: white; }
    .btn-warning { background: linear-gradient(105deg, #f59e0b, #ea580c); color: white; }
    .btn-danger { background: linear-gradient(105deg, #ef4444, #dc2626); color: white; }
    .btn-outline { background: white; border: 1px solid #cbd5e1; color: #1f2937; }
    .small-btn { padding: 6px 14px; font-size: 0.7rem; min-width: 70px; }
    
    .action-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .center-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    
    /* Summary Grid - Center */
    .summary-grid { display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0; justify-content: center; }
    .summary-box { background: rgba(255,255,255,0.9); flex:1; min-width:150px; padding:20px; border-radius:32px; text-align:center; box-shadow: 0 12px 20px -12px rgba(0,0,0,0.1); border:1px solid rgba(255,255,255,0.7); }
    
    /* Tables - Center Aligned Text */
    .table-wrapper { overflow-x: auto; margin-top: 18px; border-radius: 32px; background: #ffffffcc; padding: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    th { background: #f1f5f9; font-weight: 700; color: #0f172a; }
    
    /* Badges */
    .badge { background: #eef2ff; padding: 4px 12px; border-radius: 60px; font-size: 0.7rem; font-weight:600; display: inline-block; }
    .badge-paid { background: #10b981; color: white; }
    .badge-pending { background: linear-gradient(135deg, #f97316, #dc2626); color: white; }
    .badge-partial { background: linear-gradient(135deg, #facc15, #eab308); color: #1e293b; }
    
    /* Toast */
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #0f172ae6; backdrop-filter: blur(10px); color: white; padding: 12px 24px; border-radius: 80px; z-index: 1300; font-size: 0.85rem; opacity:0; transition:0.2s; pointer-events: none; }
    .toast.show { opacity:1; }
    
    .chart-container { max-width: 350px; margin: 20px auto; }
    .progress-bar { background: #e2e8f0; border-radius: 40px; height: 8px; margin: 16px 0; overflow: hidden; }
    .progress-fill { width:0%; height:100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.2s; }
    
    /* Filter Bar */
    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end; justify-content: center; }
    .filter-group { flex:1; min-width:120px; text-align: center; }
    .filter-group label { font-size:0.7rem; margin-bottom:4px; }
    
    /* Method Selector */
    .method-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
    .method-btn { padding: 10px 30px; border-radius: 60px; cursor: pointer; background: #e2e8f0; color: #1e293b; transition: 0.2s; font-weight: 600; min-width: 120px; text-align: center; }
    .method-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
    
    /* Login Modal */
    .login-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .login-card { background: white; border-radius: 48px; padding: 40px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 30px 40px rgba(0,0,0,0.3); }
    .login-card h2 { margin-bottom: 20px; color: #1e293b; }
    .login-card input { width: 100%; text-align: center; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 20px; }
    .hidden-content { visibility: hidden; opacity: 0; pointer-events: none; }
    
    @media (max-width:700px){ .row-2cols, .row-5cols{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app-bar"><button class="menu-icon" id="menuToggleBtn">☰</button><span class="app-title">FinMate Pro</span></div>
<div class="drawer" id="drawer">
  <div class="drawer-header"><h3>🏠 MASTER HUB</h3>
    <div style="margin-top:10px; text-align:left;"><span>🔁 Auto Sync</span><input type="checkbox" id="autoSyncToggle" checked style="width:auto; display:inline; margin-left:10px;" /></div>
    <button id="clearLocalHistoryBtn" class="btn-danger small-btn" style="margin-top:10px;">🧹 Clear Local History</button>
  </div>
  <div class="drawer-nav" id="drawerNav"></div>
</div>
<div class="overlay" id="overlay"></div>
<div class="main-content" id="mainContent"></div>
<div id="toastMsg" class="toast"></div>

<script>
  // ==================== FIXED PASSWORD ====================
  const FIXED_PASSWORD = "2024";
  
  // ==================== GOOGLE APPS SCRIPT URL ====================
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2OvIkN5gWpWT7Zio_uxe0chaFv_WnN5GxUv8r6vVqFQ14XG5JF8Ia8aodkoMBS90F/exec";
  
  let autoSyncEnabled = localStorage.getItem('autoSync') !== 'false';
  let isLoggedIn = false;
  
  // ==================== FIXED PASSWORD VERIFICATION ====================
  async function verifyPassword() {
    return new Promise((resolve) => {
      const pwd = prompt("🔐 Enter password:");
      if (pwd === FIXED_PASSWORD) {
        resolve(true);
      } else {
        showToast("Wrong password", true);
        resolve(false);
      }
    });
  }
  
  async function verifyPasswordAndLogin(password) {
    if (password === FIXED_PASSWORD) {
      isLoggedIn = true;
      document.getElementById('loginModal').remove();
      document.getElementById('appContainer').classList.remove('hidden-content');
      showToast("Login successful");
      initApp();
      return true;
    } else {
      showToast("Wrong password", true);
      return false;
    }
  }
  
  function showLoginModal() {
    const modalDiv = document.createElement('div');
    modalDiv.id = 'loginModal';
    modalDiv.className = 'login-modal';
    modalDiv.innerHTML = `
      <div class="login-card">
        <h2>🔐 FinMate Pro Login</h2>
        <p>Enter password to continue</p>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="off" />
        <div class="center-buttons" style="margin-top:20px;">
          <button id="loginSubmitBtn" class="btn-primary">Unlock</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById('loginSubmitBtn').onclick = () => {
      const pwd = document.getElementById('loginPassword').value;
      if (pwd) verifyPasswordAndLogin(pwd);
      else showToast("Enter password", true);
    };
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
    });
  }
  
  const originalBody = document.body.innerHTML;
  document.body.innerHTML = `<div id="appContainer" class="hidden-content">${originalBody}</div>`;
  showLoginModal();
  
  async function autoSync(sheetName, records) {
    if (!autoSyncEnabled || !isLoggedIn) return;
    if (!records.length) return;
    try { await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sheet: sheetName, records }) }); }
    catch(e) { console.error("Auto sync failed", e); }
  }
  
  // ==================== DATA STORAGE ====================
  let expenses = [], loans = [], contacts = [], notes = [], transactions = [], scheduledReminders = [], credentials = [], miscItems = [], examHistory = [];
  let chart, analysisChart, editingTransId, editingContactId, editingNoteId, editingCredId, editingExpenseId, editingMiscId, editingExamId = null;
  let recentFolders = JSON.parse(localStorage.getItem('recentFolders') || '[]');

  function showToast(msg, isErr = false) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.style.backgroundColor = isErr ? "#dc2626" : "#0f172a"; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function saveRecentFolders() { localStorage.setItem('recentFolders', JSON.stringify(recentFolders)); updateRecentFoldersDropdown(); }
  function addRecentFolder(name) { if (!name) return; recentFolders = recentFolders.filter(f => f !== name); recentFolders.unshift(name); if (recentFolders.length > 10) recentFolders.pop(); saveRecentFolders(); }
  function updateRecentFoldersDropdown() { let sel = document.getElementById('recentFoldersSelect'); if (sel) { sel.innerHTML = '<option value="">-- Recent Folders --</option>'; recentFolders.forEach(f => { sel.innerHTML += `<option value="${f}">📁 ${f}</option>`; }); } }
  
  function loadData() {
    expenses = JSON.parse(localStorage.getItem('expenses_final') || '[]').map(e => ({ ...e, paymentMethod: e.paymentMethod || 'Cash' }));
    loans = JSON.parse(localStorage.getItem('loans_final') || '[]'); loans.forEach(l => { l.status = l.status || 'pending'; l.paymentDate = l.paymentDate || ''; });
    contacts = JSON.parse(localStorage.getItem('contacts_final') || '[]');
    notes = JSON.parse(localStorage.getItem('notes_final') || '[]');
    transactions = JSON.parse(localStorage.getItem('transactions_final') || '[]').map(t => ({ ...t, transactionDate: t.transactionDate || t.paymentDate || '', dueAmount: t.dueAmount !== undefined ? t.dueAmount : (t.dueDate ? parseFloat(t.dueDate) : 0) }));
    scheduledReminders = JSON.parse(localStorage.getItem('scheduledReminders') || '[]');
    credentials = JSON.parse(localStorage.getItem('credentials_final') || '[]');
    miscItems = JSON.parse(localStorage.getItem('miscItems_final') || '[]');
    examHistory = JSON.parse(localStorage.getItem('examHistory_final') || '[]');
    notes.forEach(n => { if (!n.purpose) n.purpose = ''; });
  }
  function saveAll() {
    localStorage.setItem('expenses_final', JSON.stringify(expenses));
    localStorage.setItem('loans_final', JSON.stringify(loans));
    localStorage.setItem('contacts_final', JSON.stringify(contacts));
    localStorage.setItem('notes_final', JSON.stringify(notes));
    localStorage.setItem('transactions_final', JSON.stringify(transactions));
    localStorage.setItem('scheduledReminders', JSON.stringify(scheduledReminders));
    localStorage.setItem('credentials_final', JSON.stringify(credentials));
    localStorage.setItem('miscItems_final', JSON.stringify(miscItems));
    localStorage.setItem('examHistory_final', JSON.stringify(examHistory));
  }

  const syncExpenses = () => autoSync('Expenses', expenses);
  const syncLoans = () => autoSync('Loans', loans);
  const syncContacts = () => autoSync('Contacts', contacts);
  const syncNotes = () => autoSync('Notes', notes);
  const syncTransactions = () => autoSync('Transactions', transactions);
  const syncCredentials = () => autoSync('AppCredentials', credentials);
  const syncMisc = () => autoSync('Miscellaneous', miscItems);
  const syncExam = () => autoSync('ExamFormsData', examHistory);

  async function deleteRecordLocal(id, arrayName, renderFunc, updateDashboardFunc, syncFunc) {
    const verified = await verifyPassword();
    if (!verified) return;
    
    let array;
    if (arrayName === 'expenses') array = expenses;
    else if (arrayName === 'loans') array = loans;
    else if (arrayName === 'contacts') array = contacts;
    else if (arrayName === 'notes') array = notes;
    else if (arrayName === 'transactions') array = transactions;
    else if (arrayName === 'credentials') array = credentials;
    else if (arrayName === 'misc') array = miscItems;
    else if (arrayName === 'examHistory') array = examHistory;
    else return;
    const index = array.findIndex(item => item.id === id);
    if (index === -1) return;
    array.splice(index, 1);
    saveAll();
    if (renderFunc) renderFunc();
    if (updateDashboardFunc) updateDashboardFunc();
    showToast("Record deleted locally");
    if (syncFunc) syncFunc();
  }

  async function clearAllLocalData() {
    const verified = await verifyPassword();
    if (!verified) return;
    
    if (!confirm("⚠️ Delete ALL local data?")) return;
    expenses = []; loans = []; contacts = []; notes = []; transactions = []; scheduledReminders = []; credentials = []; miscItems = []; examHistory = [];
    saveAll();
    renderExpenses(); renderLoans(); renderContacts(); renderNotes(); renderTransactions(); renderMisc(); renderCredentials(); renderExamHistory(); renderScheduledReminders();
    updateDashboard(); updateContactSelect(); populateAnalysisFilters(); renderAnalysis();
    showToast("✅ All local history cleared.");
    if (autoSyncEnabled) {
      await syncExpenses(); await syncLoans(); await syncContacts(); await syncNotes();
      await syncTransactions(); await syncCredentials(); await syncMisc(); await syncExam();
    }
  }

  // ==================== JSONP & MANUAL SYNC ====================
  function jsonpRequest(params, callback, timeoutMs = 15000) {
    const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    let script = document.createElement('script');
    let timer = null;
    function cleanup() {
      if (script.parentNode) script.parentNode.removeChild(script);
      if (window[callbackName]) delete window[callbackName];
      if (timer) clearTimeout(timer);
    }
    timer = setTimeout(() => { cleanup(); callback({ status: 'error', message: 'Timeout' }); }, timeoutMs);
    window[callbackName] = function(data) { cleanup(); callback(data); };
    let url = GOOGLE_SCRIPT_URL + '?';
    for (let key in params) url += encodeURIComponent(key) + '=' + encodeURIComponent(params[key]) + '&';
    url += 'callback=' + callbackName;
    script.src = url;
    script.onerror = () => { cleanup(); callback({ status: 'error', message: 'Network error' }); };
    document.body.appendChild(script);
  }
  
  async function loadSheetDataRobust(sheetName) {
    try {
      if (typeof showToast === 'function') showToast(`Fetching ${sheetName} data...`);
      return new Promise((resolve, reject) => {
        jsonpRequest({ sheet: sheetName }, function(response) {
          if (!response) {
            reject(new Error("No response from server"));
            return;
          }
          if (response.status === "success" && Array.isArray(response.records)) {
            resolve(response.records);
          } else {
            reject(new Error(response.message || "Invalid format"));
          }
        });
      });
    } catch (err) {
      console.error(`Import crash for ${sheetName}:`, err);
      if (typeof showToast === 'function') showToast(`Failed to load ${sheetName}`);
      return [];
    }
  }

  async function manualSyncToSheet(sheetName, records, successMsg) {
    if (!records.length) { showToast("No data to sync", true); return false; }
    try {
      await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sheet: sheetName, records }) });
      showToast(successMsg || `✅ ${sheetName} synced`);
      return true;
    } catch(e) { showToast("Sync failed", true); return false; }
  }

  // ==================== FILE OPERATIONS ====================
  async function listFilesInFolder(folderName) {
    return new Promise(resolve => jsonpRequest({ action: 'listFiles', folder: folderName }, data => resolve(data?.status==='success' ? data.files : [])));
  }
  async function renameFileInFolder(folderName, oldName, newName) {
    const verified = await verifyPassword();
    if (!verified) return false;
    return new Promise(resolve => jsonpRequest({ action: 'rename', folder: folderName, oldName, newName }, data => resolve(data?.status==='success')));
  }
  async function deleteFileFromFolder(folderName, filename) {
    const verified = await verifyPassword();
    if (!verified) return false;
    return new Promise(resolve => jsonpRequest({ action: 'delete', folder: folderName, filename }, data => resolve(data?.status==='success')));
  }
  async function getFileUrl(folderName, filename) {
    return new Promise(resolve => jsonpRequest({ action: 'getFileUrl', folder: folderName, filename }, data => resolve(data?.status==='success' ? data.url : null)));
  }
  async function uploadSingleFile(folderName, file, customName, overwrite) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        const action = overwrite ? "uploadOverwrite" : "upload";
        try {
          await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, folder: folderName, filename: customName, mimeType: file.type, data: base64 }) });
          addRecentFolder(folderName);
          resolve(true);
        } catch(err) { reject(err); }
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ==================== MEDIA HUB ====================
  let mediaFilesQueue = [];
  function renderMediaQueue() {
    let container = document.getElementById('selectedFilesPreview');
    if (!container) return;
    container.innerHTML = '';
    mediaFilesQueue.forEach((item, idx) => {
      let div = document.createElement('div'); div.className = 'file-preview-item';

    let success = 0;
    for (let i=0; i<mediaFilesQueue.length; i++) {
      let item = mediaFilesQueue[i], finalName = item.customName || item.file.name;
      statusDiv.innerText = `Uploading (${i+1}/${mediaFilesQueue.length}): ${finalName}`;

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  function syncFolderSelection(source) {
    const preset = document.getElementById('presetFolderSelect'), recent = document.getElementById('recentFoldersSelect'), custom = document.getElementById('customFolderName');
    if (source === 'preset') { if(recent) recent.value = ''; if(custom) custom.value = ''; }

  function renderAnalysis() {
    let filtered = [...expenses];
    let person = document.getElementById('analysisPerson').value;
    let method = document.getElementById('analysisPaymentMethod').value;
    let year = document.getElementById('analysisYear').value;
    let month = document.getElementById('analysisMonthSelect').value;
    let fromDate = document.getElementById('analysisFromDate').value;
    let toDate = document.getElementById('analysisToDate').value;
    if(person) filtered = filtered.filter(e => e.person === person);

    if(year) filtered = filtered.filter(e => e.date.startsWith(year));
    if(month) filtered = filtered.filter(e => e.date.startsWith(month));
    if(fromDate) filtered = filtered.filter(e => e.date >= fromDate);

  let allContactsForComm = [], selectedMethod = 'email';
  function updateCommContactSelect() { allContactsForComm = [...contacts]; renderCommContactDropdown(''); }
  function renderCommContactDropdown(filter) {
    const container = document.getElementById('commContactDropdownContainer');
    if (!container) return;
    let filtered = allContactsForComm.filter(c => {
      if (selectedMethod === 'email') return c.name.toLowerCase().includes(filter.toLowerCase()) || (c.email && c.email.toLowerCase().includes(filter.toLowerCase()));
      else return c.name.toLowerCase().includes(filter.toLowerCase()) || (c.phone && c.phone.includes(filter));
    });
    let html = '<div class="search-dropdown" style="max-width:500px; margin:0 auto;"><input type="text" id="commContactSearch" placeholder="Search contacts..." autocomplete="off" style="text-align:center;" /><div id="commContactDropdownList" class="dropdown-list" style="display:none;">';
    filtered.forEach(c => {
      let value = selectedMethod === 'email' ? c.email : c.phone;
      if (value) html += `<div data-value="${value}" data-name="${c.name}" style="padding:8px; cursor:pointer; border-bottom:1px solid #eee;">${c.name} (${value})</div>`;
    });
    if (filtered.length === 0) html += '<div style="padding:10px;">No contacts found</div>';
    html += '</div></div>';
    container.innerHTML = html;
    const searchInput = document.getElementById('commContactSearch');
    const dropdownList = document.getElementById('commContactDropdownList');
    if (searchInput) {
      searchInput.value = filter;
      searchInput.addEventListener('input', e => renderCommContactDropdown(e.target.value));
      searchInput.addEventListener('focus', () => dropdownList.style.display = 'block');
      document.addEventListener('click', function(e) { if (!searchInput.contains(e.target) && !dropdownList.contains(e.target)) dropdownList.style.display = 'none'; });
    }
    document.querySelectorAll('#commContactDropdownList div[data-value]').forEach(div => {
      div.addEventListener('click', () => {
        let value = div.dataset.value, name = div.dataset.name;
        if (value) {
          let manual = document.getElementById('commManualInput');
          let formatted = selectedMethod === 'email' ? value : (value.startsWith('+') ? value : '+' + value);
          manual.value = manual.value ? manual.value + ', ' + formatted : formatted;
          showToast(`Added ${name}`);
        }
        dropdownList.style.display = 'none';
        searchInput.value = '';
      });
    });
  }
  function getCommRecipients() {
    let manual = document.getElementById('commManualInput').value;
    return manual.split(',').map(s => s.trim()).filter(s => s);
  }
  async function sendCommNow() {
    let recipients = getCommRecipients();
    if (recipients.length === 0) { alert("Please add at least one recipient"); return; }
    let subject = document.getElementById('commSubject').value.trim();
    let message = document.getElementById('commMessage').value.trim();
    if (!message) { alert("Message cannot be empty"); return; }
    let attachFile = document.getElementById('commAttachFile').files[0];
    if (selectedMethod === 'email') {
      let fileBase64 = null, fileName = null, mimeType = null;
      if (attachFile) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          fileBase64 = e.target.result.split(',')[1]; fileName = attachFile.name; mimeType = attachFile.type;
          for (let email of recipients) {
            await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'sendEmail', to:email, subject, body:message, fileBase64, fileName, mimeType }) });
          }
          showToast(`Email sent to ${recipients.length} recipient(s)`);
        };
        reader.readAsDataURL(attachFile);
      } else {
        for (let email of recipients) {
          await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'sendEmail', to:email, subject, body:message }) });
        }
        showToast(`Email sent to ${recipients.length} recipient(s)`);
      }
    } else {
      if (!subject) subject = "FinMate Message";
      let fullMessage = `*${subject}*\n\n${message}`;
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'sendWhatsApp', phones: recipients, message: fullMessage }) });
        const data = await response.json();
        if (data.status === 'success') showToast(`WhatsApp messages sent to ${recipients.length} number(s)`);
        else showToast("WhatsApp send failed: " + data.message, true);
      } catch(err) { showToast("WhatsApp send error", true); }
    }
  }
  function scheduleComm() {
    let recipients = getCommRecipients();
    if (recipients.length === 0) { alert("Please add at least one recipient"); return; }
    let date = document.getElementById('commDate').value, time = document.getElementById('commTime').value;
    if (!date || !time) { alert("Set date and time"); return; }
    let scheduledDateTime = new Date(`${date}T${time}`);
    if (isNaN(scheduledDateTime)) { alert("Invalid datetime"); return; }
    let subject = document.getElementById('commSubject').value.trim() || (selectedMethod === 'email' ? "Scheduled Email" : "Scheduled WhatsApp");
    let message = document.getElementById('commMessage').value.trim();
    if (!message) { alert("Message empty"); return; }
    let file = document.getElementById('commAttachFile').files[0];
    let reader = new FileReader();
    reader.onload = e => {
      let newReminder = {
        id: Date.now(), method: selectedMethod, recipients, subject, message,
        scheduledTime: scheduledDateTime.toISOString(), sent: false,
        attachedFileData: file ? e.target.result.split(',')[1] : null,
        attachedFileName: file ? file.name : null,
        attachedMimeType: file ? file.type : null
      };
      scheduledReminders.push(newReminder);
      saveAll();
      renderScheduledReminders();
      showToast(`Scheduled for ${scheduledDateTime.toLocaleString()}`);
      document.getElementById('commDate').value = '';
      document.getElementById('commTime').value = '';
      document.getElementById('commSubject').value = '';
      document.getElementById('commMessage').value = '';
      document.getElementById('commManualInput').value = '';
      document.getElementById('commAttachFile').value = '';
    };
    if (file) reader.readAsDataURL(file);
    else reader.onload({target:{result:null}})();
  }
  function renderScheduledReminders() {
    let container = document.getElementById('scheduledRemindersList');
    if (!container) return;
    container.innerHTML = '';
    if (!scheduledReminders.length) { container.innerHTML = '<p class="badge">No scheduled messages</p>'; return; }
    [...scheduledReminders].reverse().forEach(r => {
      let div = document.createElement('div');
      div.style.background = '#f8fafc';
      div.style.borderRadius = '30px';
      div.style.padding = '14px 18px';
      div.style.marginBottom = '12px';
      div.style.borderLeft = '5px solid #3b82f6';
      div.style.textAlign = 'center';
      let recipientsStr = r.recipients ? r.recipients.join(', ') : '';
      let methodEmoji = r.method === 'email' ? '📧' : '📱';
      div.innerHTML = `<div class="flex-between"><strong>${methodEmoji} ${recipientsStr}</strong> <span class="badge ${r.sent ? 'badge-paid' : 'badge-pending'}">${r.sent ? 'Sent' : 'Pending'}</span></div>
        <div>📅 ${new Date(r.scheduledTime).toLocaleString()}</div>
        <div><strong>${r.subject}</strong></div>
        <div>${r.message.substring(0,70)}</div>
        <div class="action-buttons" style="margin-top:10px;">${!r.sent ? `<button class="small-btn btn-success cancel-reminder" data-id="${r.id}">❌ Cancel</button>` : ''}<button class="small-btn btn-danger delete-reminder" data-id="${r.id}">🗑️ Delete</button></div>`;
      if (!r.sent) {
        let cancel = div.querySelector('.cancel-reminder');
        cancel.onclick = () => { scheduledReminders = scheduledReminders.filter(s => s.id !== r.id); saveAll(); renderScheduledReminders(); showToast("Cancelled"); };
      }
      let del = div.querySelector('.delete-reminder');
      del.onclick = () => { scheduledReminders = scheduledReminders.filter(s => s.id !== r.id); saveAll(); renderScheduledReminders(); showToast("Removed"); };
      container.appendChild(div);
    });
  }
  function checkAndFireReminders() {
    let now = new Date();
    scheduledReminders.forEach(r => {
      if (!r.sent && new Date(r.scheduledTime) <= now) {
        (async () => {
          if (r.method === 'email') {
            let fileBase64 = r.attachedFileData, fileName = r.attachedFileName, mimeType = r.attachedMimeType;
            if (!fileBase64) {
              const { jsPDF } = window.jspdf;
              let doc = new jsPDF();
              doc.setFontSize(18); doc.text("Reminder from FinMate", 20, 20);
              doc.setFontSize(12); doc.text(`Scheduled: ${r.scheduledTime}`, 20, 35);
              doc.text(`Subject: ${r.subject}`, 20, 50);
              doc.text("Message:", 20, 65);
              let lines = doc.splitTextToSize(r.message, 170);
              doc.text(lines, 20, 75);
              doc.setFontSize(10); doc.text("Sent from FinMate Pro", 20, 85);
              fileBase64 = doc.output('datauristring').split(',')[1];
              fileName = `reminder_${r.id}.pdf`; mimeType = 'application/pdf';
            }
            for (let email of r.recipients) {
              await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'sendEmail', to:email, subject:r.subject, body:r.message, fileBase64, fileName, mimeType }) });
            }
            r.sent = true; saveAll(); renderScheduledReminders(); showToast(`Email reminder sent`);
          } else if (r.method === 'whatsapp') {
            let fullMessage = `*${r.subject}*\n\n${r.message}`;
            try {
              const response = await fetch(GOOGLE_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'sendWhatsApp', phones: r.recipients, message: fullMessage }) });
              const data = await response.json();
              if (data.status === 'success') { r.sent = true; saveAll(); renderScheduledReminders(); showToast(`WhatsApp reminder sent`); }
              else showToast("WhatsApp send failed", true);
            } catch(err) { console.error(err); }
          }
        })();
      }
    });
  }

  async function loadSheetData(sheetName, targetArray, renderFunc, updateDashboardFunc) {
    const verified = await verifyPassword();
    if (!verified) return;
    if(!confirm(`Load ${sheetName} from Google Sheet? This will REPLACE current local data.`)) return;
    try {
      let records = await loadSheetDataRobust(sheetName);
      if (records && Array.isArray(records) && records.length > 0) {
        if(targetArray==='expenses'){ expenses = records.map(r=>({...r, paymentMethod: r.paymentMethod || 'Cash'})); saveAll(); renderFunc(); if(updateDashboardFunc) updateDashboardFunc(); showToast(`Loaded ${expenses.length} expenses`); populateAnalysisFilters(); }
        else if(targetArray==='loans'){ loans = records; saveAll(); renderFunc(); if(updateDashboardFunc) updateDashboardFunc(); showToast(`Loaded ${loans.length} loans`); }
        else if(targetArray==='contacts'){ contacts = records; saveAll(); renderFunc(); updateContactSelect(); updateCommContactSelect(); showToast(`Loaded ${contacts.length} contacts`); }
        else if(targetArray==='notes'){ notes = records; saveAll(); renderFunc(); showToast(`Loaded ${notes.length} notes`); }
        else if(targetArray==='transactions'){ transactions = records; saveAll(); renderFunc(); showToast(`Loaded ${transactions.length} transactions`); }
        else if(targetArray==='credentials'){ credentials = records; saveAll(); renderFunc(); showToast(`Loaded ${credentials.length} credentials`); }
        else if(targetArray==='misc'){ miscItems = records; saveAll(); renderFunc(); showToast(`Loaded ${miscItems.length} misc entries`); }
      } else { showToast("No data or error", true); }
    } catch(e){ showToast("Load failed: " + e.message, true); }
  }

  // ==================== INITIALIZATION ====================
  function initApp() {
    renderAllPages(); buildDrawer(); loadData();
    let todayDate = new Date().toISOString().slice(0,10);
    let nowTime = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if(document.getElementById('expenseDate')) document.getElementById('expenseDate').value = todayDate;
    if(document.getElementById('expenseTime')) document.getElementById('expenseTime').value = nowTime;
    if(document.getElementById('loanDate')) document.getElementById('loanDate').value = todayDate;
    if(document.getElementById('loanTime')) document.getElementById('loanTime').value = nowTime;
    if(document.getElementById('tpTransactionDate')) document.getElementById('tpTransactionDate').value = todayDate;
    
    renderExpenses(); renderLoans(); renderTransactions(); renderContacts(); renderNotes(); renderCredentials(); renderMisc(); 
    updateDashboard(); renderExamHistory(); renderScheduledReminders(); updateRecentFoldersDropdown(); populateAnalysisFilters(); renderAnalysis();
    setInterval(checkAndFireReminders, 30000);
    
    const toggle = document.getElementById('autoSyncToggle');
    autoSyncEnabled = localStorage.getItem('autoSync') !== 'false';
    toggle.checked = autoSyncEnabled;
    toggle.addEventListener('change', () => {
      autoSyncEnabled = toggle.checked;
      localStorage.setItem('autoSync', autoSyncEnabled);
      showToast(autoSyncEnabled ? "Auto Sync ON" : "Auto Sync OFF");
    });
    
    document.getElementById('clearLocalHistoryBtn').onclick = clearAllLocalData;
    document.getElementById('addExpenseBtn').onclick = addOrUpdateExpense;
    document.getElementById('cancelExpenseEditBtn').onclick = cancelExpenseEdit;
    document.getElementById('saveContactBtn').onclick = addOrUpdateContact;
    document.getElementById('saveNoteBtn').onclick = addOrUpdateNote;
    document.getElementById('saveTransactionBtn').onclick = addOrUpdateTransaction;
    document.getElementById('saveCredBtn').onclick = addOrUpdateCredential;
    document.getElementById('saveMiscBtn').onclick = addOrUpdateMisc;
    document.getElementById('cancelMiscEditBtn').onclick = cancelMiscEdit;
    document.getElementById('scheduleCommBtn').onclick = scheduleComm;
    document.getElementById('sendNowCommBtn').onclick = sendCommNow;
    document.getElementById('tpQuantity').addEventListener('input', autoCalcAmount);
    document.getElementById('tpRate').addEventListener('input', autoCalcAmount);
    
    document.getElementById('saveLoanBtn').onclick = () => {
      let cp = document.getElementById('counterpartyName').value.trim(), amt = document.getElementById('loanAmount').value, due = document.getElementById('loanDueDate').value;
      if (!cp || !amt || !due) { alert("Required fields"); return; }
      let wasEditing = (window._editingLoanId !== null && window._editingLoanId !== undefined);
      if(window._editingLoanId) {
        let idx = loans.findIndex(l=>l.id===window._editingLoanId);
        if(idx!==-1) {
          loans[idx] = { ...loans[idx], type: document.getElementById('transactionType').value, counterparty: cp, amount: Number(amt), purpose: document.getElementById('loanPurpose').value, date: document.getElementById('loanDate').value, time: document.getElementById('loanTime').value, dueDate: due, status: loans[idx].status, paymentDate: loans[idx].paymentDate };
          saveAll(); renderLoans(); updateDashboard(); showToast("Loan updated"); cancelLoanEdit();
          if(autoSyncEnabled) syncLoans();
          navigateToPage('loanListPage');
        }
      } else {
        loans.push({ id: Date.now(), type: document.getElementById('transactionType').value, counterparty: cp, amount: Number(amt), purpose: document.getElementById('loanPurpose').value, date: document.getElementById('loanDate').value, time: document.getElementById('loanTime').value, dueDate: due, status: 'pending', paymentDate: '' });
        saveAll(); renderLoans(); updateDashboard(); showToast("Transaction saved");
        document.getElementById('counterpartyName').value = ''; document.getElementById('loanAmount').value = ''; document.getElementById('loanPurpose').value = ''; document.getElementById('loanDueDate').value = '';
        if(autoSyncEnabled) syncLoans();
      }
    };
    
    const emailBtn = document.getElementById('emailMethodBtn');
    const whatsappBtn = document.getElementById('whatsappMethodBtn');
    emailBtn.onclick = () => { selectedMethod = 'email'; emailBtn.classList.add('active'); whatsappBtn.classList.remove('active'); document.getElementById('commManualInput').placeholder = "Email addresses (comma separated)"; updateCommContactSelect(); };
    whatsappBtn.onclick = () => { selectedMethod = 'whatsapp'; whatsappBtn.classList.add('active'); emailBtn.classList.remove('active'); document.getElementById('commManualInput').placeholder = "WhatsApp numbers with country code (comma separated) e.g., +919876543210"; updateCommContactSelect(); };
    updateCommContactSelect();
    
    document.getElementById('syncExpensesSheetBtn').onclick = () => manualSyncToSheet('Expenses', expenses, 'Expenses synced');
    document.getElementById('syncLoansSheetBtn').onclick = () => manualSyncToSheet('Loans', loans, 'Loans synced');
    document.getElementById('syncContactsSheetBtn').onclick = () => manualSyncToSheet('Contacts', contacts, 'Contacts synced');
    document.getElementById('syncNotesSheetBtn').onclick = () => manualSyncToSheet('Notes', notes, 'Notes synced');
    document.getElementById('syncTransactionsSheetBtn').onclick = () => manualSyncToSheet('Transactions', transactions, 'Transactions synced');
    document.getElementById('syncCredentialsSheetBtn').onclick = () => manualSyncToSheet('AppCredentials', credentials, 'Credentials synced');
    document.getElementById('syncMiscSheetBtn').onclick = () => manualSyncToSheet('Miscellaneous', miscItems, 'Misc synced');
    document.getElementById('syncExamToSheetBtn').onclick = () => manualSyncToSheet('ExamFormsData', examHistory, 'Exam history synced');
    
    document.getElementById('loadExpensesFromSheet').onclick = () => loadSheetData('Expenses', 'expenses', renderExpenses, updateDashboard);
    document.getElementById('loadLoansFromSheet').onclick = () => loadSheetData('Loans', 'loans', renderLoans, updateDashboard);
    document.getElementById('loadContactsFromSheet').onclick = () => loadSheetData('Contacts', 'contacts', renderContacts, null);
    document.getElementById('loadNotesFromSheet').onclick = () => loadSheetData('Notes', 'notes', renderNotes, null);
    document.getElementById('loadTransactionsFromSheet').onclick = () => loadSheetData('Transactions', 'transactions', renderTransactions, null);
    document.getElementById('loadCredentialsFromSheet').onclick = () => loadSheetData('AppCredentials', 'credentials', renderCredentials, null);
    document.getElementById('loadMiscFromSheet').onclick = () => loadSheetData('Miscellaneous', 'misc', renderMisc, null);
    
    document.getElementById('submitExamFormBtn').onclick = submitOrUpdateExam;
    document.getElementById('cancelExamEditBtn').onclick = cancelExamEdit;
    document.getElementById('loadExamFromSheetBtn').onclick = loadExamFromSheet;
    
    document.getElementById('applyAnalysisFilter').onclick = renderAnalysis;
    document.getElementById('resetAnalysisFilter').onclick = resetAnalysisFilters;
    
    let dropzone = document.getElementById('multiDropzone'), fileInput = document.getElementById('multiFileInput');
    if(dropzone && fileInput){
      dropzone.onclick = () => fileInput.click();
      dropzone.ondragover = e => { e.preventDefault(); dropzone.style.borderColor='#7c3aed'; };
      dropzone.ondragleave = () => { dropzone.style.borderColor='#7c3aed'; };
      dropzone.ondrop = e => { e.preventDefault(); addFilesToQueue(Array.from(e.dataTransfer.files)); };
      fileInput.onchange = e => { addFilesToQueue(Array.from(e.target.files)); fileInput.value=''; };
    }
    document.getElementById('uploadAllFilesBtn').onclick = uploadAllQueuedFiles;
    document.getElementById('clearQueueBtn').onclick = clearMediaQueue;
    document.getElementById('refreshFileListBtn').onclick = async () => { await refreshFileList(); };
    
    const presetSelect = document.getElementById('presetFolderSelect');
    const recentSelect = document.getElementById('recentFoldersSelect');
    const customInput = document.getElementById('customFolderName');
    if(presetSelect) presetSelect.addEventListener('change', () => { if(presetSelect.value) syncFolderSelection('preset'); });
    if(recentSelect) recentSelect.addEventListener('change', () => { if(recentSelect.value) syncFolderSelection('recent'); });
    if(customInput) customInput.addEventListener('input', () => { if(customInput.value.trim()) syncFolderSelection('custom'); });
    document.getElementById('recentFoldersSelect').onchange = function(){ if(this.value) { document.getElementById('customFolderName').value=this.value; document.getElementById('currentManageFolder').value=this.value; syncFolderSelection('recent'); } };
    
    let drawer = document.getElementById('drawer'), overlay = document.getElementById('overlay');
    document.getElementById('menuToggleBtn').onclick = () => { drawer.classList.add('open'); overlay.classList.add('active'); };
    overlay.onclick = () => { drawer.classList.remove('open'); overlay.classList.remove('active'); };
    document.querySelectorAll('.drawer-nav button').forEach(btn => { btn.addEventListener('click', () => { let id = btn.getAttribute('data-page'); navigateToPage(id); if(id==='mediaUploadPage') refreshFileList(); if(id==='expenseListPage') renderExpenses(); if(id==='loanListPage') renderLoans(); if(id==='dashboardPage') updateDashboard(); if(id==='contactsPage'){ renderContacts(); updateCommContactSelect(); } if(id==='notesPage') renderNotes(); if(id==='sellPurchasePage') renderTransactions(); if(id==='communicationPage') { updateCommContactSelect(); renderScheduledReminders(); } if(id==='credentialsPage') renderCredentials(); if(id==='expenseAnalysisPage') { populateAnalysisFilters(); renderAnalysis(); } if(id==='miscPage') renderMisc(); if(id==='examFormPage') renderExamHistory(); }); });
    
    navigateToPage('dashboardPage');
  }
</script>
